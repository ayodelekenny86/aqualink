[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54323
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop_port = 54326

[edge_functions]
# Enable Edge Functions for local development
enabled = true

# Each function directory carries its own deno.json with the import map, which
# bypasses the CLI's import-map injection. The previous import_map.json entries
# made the CLI pin @supabase/supabase-js@2.117.2, a URL esm.sh no longer serves,
# so every deploy failed to bundle with "Module not found". deno.json uses the
# unpinned https://esm.sh/@supabase/supabase-js@2/dist/esm/index.js, which
# resolves. This also clears the CLI's deprecated-import-map warning.

[functions]
# Function-specific environment variables (for local development)
# These are overridden by Supabase Dashboard secrets in production
[functions.config]
verify_jwt = false

[functions.orders]
verify_jwt = false

[functions.pricing]
verify_jwt = false

[functions.ops]
verify_jwt = false

[functions.payments]
verify_jwt = false

[functions.sellers]
verify_jwt = false

[functions.fcm]
verify_jwt = false

[functions.test]
verify_jwt = false