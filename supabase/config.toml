[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54323
major_version = 16

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop_port = 54326

[edge_functions]
# Enable Edge Functions for local development
enabled = true

# Function-specific configuration
[edge_functions.config]
import_map = "./functions/config/import_map.json"

[edge_functions.orders]
import_map = "./functions/orders/import_map.json"

[edge_functions.pricing]
import_map = "./functions/pricing/import_map.json"

[edge_functions.ops]
import_map = "./functions/ops/import_map.json"

[edge_functions.payments]
import_map = "./functions/payments/import_map.json"

[edge_functions.sellers]
import_map = "./functions/sellers/import_map.json"

[functions]
# Function-specific environment variables (for local development)
# These are overridden by Supabase Dashboard secrets in production
[functions.config]
verify_jwt = false

[functions.orders]
verify_jwt = false

[functions.pricing]
verify_jwt = false

[functions.ops]
verify_jwt = false

[functions.payments]
verify_jwt = false

[functions.sellers]
verify_jwt = false