<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#112d43" />
    <meta
      name="description"
      content="AquaLink is the trusted marketplace for booking, delivering, and managing water in Ghana."
    />
    <!--
      Referrer and permissions are narrowed to what the app actually uses, and
      the base-uri/origin guards blunt markup-injection and form-hijacking
      attempts. The CSP is set per-response by the host (see firebase.json) so
      it can be tightened in production without touching the markup.
    -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <title>AquaLink | Water delivery workspace</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
